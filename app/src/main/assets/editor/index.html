<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  @font-face { font-family: 'JetBrains Mono'; src: url('JetBrainsMono.ttf'); }
  html, body { margin: 0; height: 100%; background: #08080A; overflow: hidden; }
  /* Pinned to the viewport: percentage heights can resolve to 0 while the WebView is laid out. */
  #editor { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  #editor .cm-editor { position: absolute; top: 0; right: 0; bottom: 0; left: 0; height: 100%; outline: none !important; }
</style>
</head>
<body>
<div id="editor"></div>
<script src="editor.js"></script>
</body>
</html>
